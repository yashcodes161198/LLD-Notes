<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  </defs>
  <rect width="1000" height="800" fill="#ffffff"/>

  <!-- BookingSystem -->
  <rect x="300" y="20" width="400" height="262" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="500" y="47" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">BookingSystem</text>
  <text x="320" y="74" font-size="13" fill="#2563eb" font-weight="600">shows : Map&lt;showId, Show&gt;</text>
  <rect x="320" y="82" width="360" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="335" y="100" font-size="14" fill="#0f172a">"S1"  →  Show S1</text>
  <rect x="320" y="112" width="360" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="335" y="130" font-size="14" fill="#0f172a">"S2"  →  Show S2</text>
  <text x="320" y="162" font-size="13" fill="#7c3aed" font-weight="600">bookings : Map&lt;bookingId, Booking&gt;</text>
  <rect x="320" y="170" width="360" height="26" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="335" y="188" font-size="14" fill="#0f172a">"B1"  →  Booking B1</text>
  <rect x="320" y="200" width="360" height="26" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="335" y="218" font-size="14" fill="#0f172a">"B2"  →  Booking B2</text>
  <text x="500" y="250" text-anchor="middle" font-size="12" fill="#64748b">request carries a showId → look it up in shows</text>
  <text x="500" y="268" text-anchor="middle" font-size="12" fill="#64748b">request carries a bookingId → look it up in bookings</text>

  <!-- Show S1 -->
  <rect x="30" y="310" width="340" height="180" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="200" y="336" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Show S1  (6 pm)</text>
  <text x="50" y="364" font-size="13" fill="#059669" font-weight="600">seats : Map&lt;seatId, Seat&gt;   (layout)</text>
  <rect x="50" y="372" width="300" height="26" rx="4" fill="#d1fae5" stroke="#059669"/>
  <text x="65" y="390" font-size="14" fill="#0f172a">"P1"  →  Seat p1</text>
  <text x="50" y="424" font-size="13" fill="#d97706" font-weight="600">seatHolders : Map&lt;seatId, Booking&gt;</text>
  <rect x="50" y="432" width="300" height="26" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="65" y="450" font-size="14" fill="#0f172a">"P1"  →  Booking B1</text>
  <text x="355" y="480" text-anchor="end" font-size="12" fill="#64748b">lock = this Show object</text>

  <!-- Show S2 -->
  <rect x="630" y="310" width="340" height="180" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="800" y="336" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Show S2  (9 pm)</text>
  <text x="650" y="364" font-size="13" fill="#059669" font-weight="600">seats : Map&lt;seatId, Seat&gt;   (layout)</text>
  <rect x="650" y="372" width="300" height="26" rx="4" fill="#d1fae5" stroke="#059669"/>
  <text x="665" y="390" font-size="14" fill="#0f172a">"P1"  →  Seat p1</text>
  <text x="650" y="424" font-size="13" fill="#d97706" font-weight="600">seatHolders : Map&lt;seatId, Booking&gt;</text>
  <rect x="650" y="432" width="300" height="26" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="665" y="450" font-size="14" fill="#0f172a">"P1"  →  Booking B2</text>
  <text x="955" y="480" text-anchor="end" font-size="12" fill="#64748b">lock = this Show object</text>

  <!-- Seat p1 (shared) -->
  <rect x="420" y="352" width="160" height="92" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="500" y="378" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Seat p1</text>
  <text x="500" y="400" text-anchor="middle" font-size="13" fill="#0f172a">id "P1", PREMIUM</text>
  <text x="500" y="420" text-anchor="middle" font-size="12" fill="#64748b">ONE object, shared</text>
  <text x="500" y="436" text-anchor="middle" font-size="12" fill="#64748b">no "booked" flag</text>

  <!-- Booking B1 -->
  <rect x="30" y="560" width="340" height="120" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="200" y="586" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Booking B1</text>
  <text x="50" y="612" font-size="14" fill="#0f172a">user u1 · seatIds ["P1"]</text>
  <text x="50" y="636" font-size="14" fill="#0f172a">status CONFIRMED · expiresAt 18:10</text>
  <text x="50" y="660" font-size="14" fill="#0f172a">show → Show S1</text>

  <!-- Booking B2 -->
  <rect x="630" y="560" width="340" height="120" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="800" y="586" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Booking B2</text>
  <text x="650" y="612" font-size="14" fill="#0f172a">user u2 · seatIds ["P1"]</text>
  <text x="650" y="636" font-size="14" fill="#0f172a">status CONFIRMED · expiresAt 18:11</text>
  <text x="650" y="660" font-size="14" fill="#0f172a">show → Show S2</text>

  <!-- arrows: shows map -->
  <path d="M320 95 L200 95 L200 306" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#aBlue)"/>
  <path d="M680 125 L800 125 L800 306" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#aBlue)"/>
  <!-- arrows: bookings map -->
  <path d="M320 183 L12 183 L12 620 L26 620" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#aPurple)"/>
  <path d="M680 213 L988 213 L988 620 L974 620" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#aPurple)"/>
  <!-- arrows: seats map -> shared seat -->
  <path d="M350 385 L416 392" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#aGreen)"/>
  <path d="M650 385 L584 392" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#aGreen)"/>
  <!-- arrows: seatHolders -> booking -->
  <path d="M200 458 L200 556" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#aOrange)"/>
  <path d="M800 458 L800 556" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#aOrange)"/>

  <!-- takeaway -->
  <rect x="30" y="705" width="940" height="80" rx="8" fill="#fff7ed" stroke="#d97706"/>
  <text x="500" y="733" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">"Is seat P1 taken for show S2?"  →  ask Show S2's seatHolders, and only that map.</text>
  <text x="500" y="757" text-anchor="middle" font-size="14" fill="#0f172a">seatHolders IS the seat → booking map. Each show has its own, so B1 (in S1's map) can never block S2.</text>
  <text x="500" y="777" text-anchor="middle" font-size="13" fill="#64748b">Blue/purple = BookingSystem lookups by id · Green = the fixed layout · Orange = who holds a seat right now</text>
</svg>
